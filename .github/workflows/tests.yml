name: Python CPU regression

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'research/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python 3.12 CPU / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update package installer
        run: python -m pip install --upgrade pip
      - name: Install CPU learning runtime
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and pinned dependencies
        run: python -m pip install -r requirements-stage1-learning.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Verify required inference fixtures are available
        run: python -c "from pathlib import Path; import torch; from auv3d.prediction import PPLNMPredictor; paths=[Path('artifacts_stage1')/name/'pplnm.pt' for name in ('pplnm_150','pplnm_smoke')]; [PPLNMPredictor(p) for p in paths]; print('CPU torch:',torch.__version__,'; inference fixtures loaded:',len(paths))"
      - name: Create independent test output directory
        run: python -c "from pathlib import Path; import os; Path(os.environ['RUNNER_TEMP'],'auv-tests').mkdir(parents=True,exist_ok=True)"
      - name: Run original and stage 1 through stage 5 tests
        working-directory: ${{ runner.temp }}/auv-tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest "${{ github.workspace }}/PythonVehicleSimulator/tests" "${{ github.workspace }}/tests_stage1" "${{ github.workspace }}/tests_stage2" "${{ github.workspace }}/tests_stage3" "${{ github.workspace }}/tests_stage4" "${{ github.workspace }}/tests_stage5" -q --basetemp "${{ runner.temp }}/auv-tests/pytest" --junitxml "${{ runner.temp }}/auv-tests/junit.xml" -o "cache_dir=${{ runner.temp }}/auv-tests/cache"
